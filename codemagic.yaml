workflows:
  release-build:
    instance_type: linux
    environment:
      java: 17
      android_signing:
        - keystore_file
      groups:
        - google_credentials
        - production
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release'
          include: true
          source: true
    scripts:
      - name: Restore firebase info
        script: echo -n "$FIREBASE_INFO" > ./app/google-services.json
      - name: Set up key.properties
        script: |
          : "${SCHEDULE_SEARCH_API_ENDPOINT:?SCHEDULE_SEARCH_API_ENDPOINT is required}"
          : "${SCHEDULE_SEARCH_API_KEY:?SCHEDULE_SEARCH_API_KEY is required}"
          cat >> "$CM_BUILD_DIR/local.properties" <<EOF
          keystore.storepwd=$CM_KEYSTORE_PASSWORD
          keystore.keypwd=$CM_KEY_PASSWORD
          keystore.alias=$CM_KEY_ALIAS
          keystore.file=$CM_KEYSTORE_PATH
          scheduleSearchApiEndpoint=$SCHEDULE_SEARCH_API_ENDPOINT
          scheduleSearchApiKey=$SCHEDULE_SEARCH_API_KEY
          EOF
      - name: Set up script
        script: chmod +x ./gradlew
      - name: Build Android Production Release
        script: |
          #!/bin/bash
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "${PACKAGE_NAME}")
          if [ -z $LATEST_GOOGLE_PLAY_BUILD_NUMBER ];then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$(($LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          fi
          ./gradlew bundleProdRelease -PversionCode=${UPDATED_BUILD_NUMBER} -PendOfVersionName=${UPDATED_BUILD_NUMBER}
    artifacts:
      - app/build/**/outputs/bundle/**/*.aab
    publishing:
      slack:
        channel: '#feed'
        notify_on_build_start: false
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true  # To not receive a notification when a build fails
  e2e-test:
    instance_type: linux
    environment:
      java: 17
      android_signing:
        - keystore_file
      groups:
        - firebase_credentials
        - development
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'release'
          include: true
          source: false
    scripts:
      - name: Restore firebase info
        script: echo -n "$FIREBASE_INFO" > ./app/google-services.json
      - name: Set up schedule search properties
        script: |
          : "${SCHEDULE_SEARCH_API_ENDPOINT:?SCHEDULE_SEARCH_API_ENDPOINT is required}"
          : "${SCHEDULE_SEARCH_API_KEY:?SCHEDULE_SEARCH_API_KEY is required}"
          cat >> "$CM_BUILD_DIR/local.properties" <<EOF
          scheduleSearchApiEndpoint=$SCHEDULE_SEARCH_API_ENDPOINT
          scheduleSearchApiKey=$SCHEDULE_SEARCH_API_KEY
          EOF
      - name: Set up script
        script: chmod +x ./gradlew
      - name: Build Dev Debug Apk
        script: |
          #!/bin/bash
          set -ex
          ./gradlew assembleDevDebug
          DEV_DEBUG_APK_FILE=$(find app/build/outputs/apk/dev/debug -name "*-dev-debug.apk" | head -n 1)
          if [ -z "${DEV_DEBUG_APK_FILE}" ]; then
            echo "Dev debug APK not found."
            exit 1
          fi
          echo "DEV_DEBUG_APK_FILE=${DEV_DEBUG_APK_FILE}" >> $CM_ENV
      - name: Build test package
        script: |
          #!/bin/bash
          set -ex
          ./gradlew assembleDevDebugAndroidTest
          ANDROID_TEST_DEBUG_APK_FILE=$(find app/build/outputs/apk/androidTest/dev/debug -name "*-dev-debug-androidTest.apk" | head -n 1)
          if [ -z "${ANDROID_TEST_DEBUG_APK_FILE}" ]; then
            echo "Android test APK not found."
            exit 1
          fi
          echo "ANDROID_TEST_DEBUG_APK_FILE=${ANDROID_TEST_DEBUG_APK_FILE}" >> $CM_ENV
      - name: Run Firebase Test Lab E2E Test
        script: |
          #!/bin/bash
          set -ex
          : "${GCLOUD_KEY_FILE:?GCLOUD_KEY_FILE is required}"
          : "${FIREBASE_PROJECT:?FIREBASE_PROJECT is required}"
          : "${FIREBASE_TEST_LAB_MODEL:?FIREBASE_TEST_LAB_MODEL is required}"
          : "${FIREBASE_TEST_LAB_VERSION:?FIREBASE_TEST_LAB_VERSION is required}"
          : "${DEV_DEBUG_APK_FILE:?DEV_DEBUG_APK_FILE is required}"
          : "${ANDROID_TEST_DEBUG_APK_FILE:?ANDROID_TEST_DEBUG_APK_FILE is required}"
          GCLOUD_KEY_FILE_PATH="$CM_BUILD_DIR/gcloud_key_file.json"
          trap 'rm -f "$GCLOUD_KEY_FILE_PATH"' EXIT
          (umask 077 && printf '%s' "$GCLOUD_KEY_FILE" > "$GCLOUD_KEY_FILE_PATH")
          gcloud auth activate-service-account --key-file="$GCLOUD_KEY_FILE_PATH"
          gcloud --quiet config set project "$FIREBASE_PROJECT"
          DEVICE_ARGS="model=${FIREBASE_TEST_LAB_MODEL},version=${FIREBASE_TEST_LAB_VERSION}"
          if [ -n "${FIREBASE_TEST_LAB_LOCALE:-}" ]; then
            DEVICE_ARGS="${DEVICE_ARGS},locale=${FIREBASE_TEST_LAB_LOCALE}"
          fi
          if [ -n "${FIREBASE_TEST_LAB_ORIENTATION:-}" ]; then
            DEVICE_ARGS="${DEVICE_ARGS},orientation=${FIREBASE_TEST_LAB_ORIENTATION}"
          fi
          RESULTS_DIR="codemagic/e2e-test/${CM_BUILD_ID:-local}-$(date +%Y%m%d%H%M%S)"
          gcloud firebase test android run \
            --type instrumentation \
            --app "$DEV_DEBUG_APK_FILE" \
            --test "$ANDROID_TEST_DEBUG_APK_FILE" \
            --device "$DEVICE_ARGS" \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --results-history-name "throwtrash-android-e2e" \
            --results-dir "$RESULTS_DIR" \
            --timeout "${FIREBASE_TEST_LAB_TIMEOUT:-15m}"
  dev-release-build:
    instance_type: linux
    environment:
      java: 17
      groups:
        - deploygate_credentials
        - google_credentials
        - development
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
        - pattern: 'release'
          include: false
          source: false
        - pattern: 'main'
          include: false
          source: false
    scripts:
      - name: Restore firebase info
        script: echo -n "$FIREBASE_INFO" > ./app/google-services.json
      - name: Set up schedule search properties
        script: |
          : "${SCHEDULE_SEARCH_API_ENDPOINT:?SCHEDULE_SEARCH_API_ENDPOINT is required}"
          : "${SCHEDULE_SEARCH_API_KEY:?SCHEDULE_SEARCH_API_KEY is required}"
          cat >> "$CM_BUILD_DIR/local.properties" <<EOF
          scheduleSearchApiEndpoint=$SCHEDULE_SEARCH_API_ENDPOINT
          scheduleSearchApiKey=$SCHEDULE_SEARCH_API_KEY
          EOF
      - name: Set up script
        script: chmod +x ./gradlew
      - name: Unit test
        script: ./gradlew testDevDebugUnitTest
      - name: Build Android and Deploy Development Release Aab
        script: |
          #!/bin/bash
          set -e
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "${PACKAGE_NAME}" 2>/dev/null || true)
          if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ]; then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$(($LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          fi
          ./gradlew bundleDevRelease -PversionCode=${UPDATED_BUILD_NUMBER} -PendOfVersionName=${UPDATED_BUILD_NUMBER}
          AAB_FILE=$(find app/build/outputs/bundle/devRelease -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "AAB file not found."
            exit 1
          fi
          DEPLOYGATE_OWNER_NAME=${DEPLOYGATE_OWNER_NAME:-quotto}
          curl \
            --url "https://deploygate.com/api/users/${DEPLOYGATE_OWNER_NAME}/apps" \
            -H "Authorization: Bearer ${DEPLOYGATE_TOKEN}" \
            -X POST \
            -F "file=@${AAB_FILE}" \
            --form-string "message=codemagic dev release ${UPDATED_BUILD_NUMBER}"
    artifacts:
      - app/build/**/outputs/bundle/**/*.aab
    publishing:
      slack:
        channel: '#feed'
        notify_on_build_start: false
        notify:
          success: true # To not receive a notification when a build succeeds
          failure: true # To not receive a notification when a build fails
